<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory - University</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Department of DevOps</h1>
            <p>Student Directory • Class of 2026</p>
        </header>

        <main class="gallery-container">
            <div class="badge-grid">

                <div class="badge-card">
                    <img src="https://ui-avatars.com/api/?name=Jane+Doe&size=150&background=1b365d&color=fff" alt="Jane Doe" class="avatar">
                    <h2>Jane Doe</h2>
                    <div class="badge-meta">
                        <span class="year">Class of 2026</span>
                    </div>
                    <button class="profile-btn">View Profile</button>
                </div>

                <div class="badge-card">
                    <img src="https://ui-avatars.com/api/?name=John+Smith&size=150&background=1b365d&color=fff" alt="John Smith" class="avatar">
                    <h2>John Smith</h2>
                    <div class="badge-meta">
                        <span class="year">Class of 2026</span>
                    </div>
                    <button class="profile-btn">View Profile</button>
                </div>

                <div class="badge-card">
                    <img src="https://ui-avatars.com/api/?name=Alice+Williams&size=150&background=1b365d&color=fff" alt="Alice Williams" class="avatar">
                    <h2>Alice Williams</h2>
                    <div class="badge-meta">
                        <span class="year">Class of 2026</span>
                    </div>
                    <button class="profile-btn">View Profile</button>
                </div>

                <div class="badge-card">
                    <img src="https://ui-avatars.com/api/?name=Michael+Brown&size=150&background=1b365d&color=fff" alt="Michael Brown" class="avatar">
                    <h2>Michael Brown</h2>
                    <div class="badge-meta">
                        <span class="year">Class of 2026</span>
                    </div>
                    <button class="profile-btn">View Profile</button>
                </div>

            </div>
        </main>
    </div>
</body>

</html>
